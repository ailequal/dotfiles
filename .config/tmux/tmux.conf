# display & colors #
####################

set -g default-terminal "tmux-256color" # use 256-color terminal for better color rendering
set -ag terminal-overrides ",*:RGB"     # enable 24-bit true color support to match terminal settings


# quality of life #
###################

set -g status-keys vi        # use vi-style key bindings in the status line command prompt
setw -g mode-keys vi         # use vi-style key bindings when in copy mode
set -g mouse on              # enable mouse support (clicking, resizing, scrolling)
set -g repeat-time 1500      # time (ms) allowed to repeat commands without pressing the prefix again
set -sg escape-time 1        # remove delay when pressing ESC (fixes vim mode-switching lag)
# set -g history-limit 50000 # increase the scrollback buffer size to 50,000 lines


# terminal capabilities #
#########################

set -g allow-passthrough on                # let apps send escape sequences to the outer terminal (notifications, images)
set -s extended-keys on                    # let tmux distinguish Shift+Enter from Enter
set -as terminal-features 'xterm*:extkeys' # declare that xterm-like terminals support extended keys


# window & pane indexing #
##########################

set -g base-index 1                    # start window numbering at 1 (default is 0)
setw -g pane-base-index 1              # start pane numbering at 1 (default is 0)
set-option -g renumber-windows on      # automatically renumber remaining windows when one is closed
# set-window-option -g xterm-keys on   # allow passing modifier keys (like Alt/Ctrl) to terminal applications


# status bar & ui #
###################

# set-option -g status-position top    # move the status bar to the top of the screen (default is bottom)
set -g status-style "bg=default,fg=default" # use terminal's default background/foreground colors
set -g status-left ""                       # clear the left side of the status bar
set -g status-right-length 50               # set the maximum length for the right status bar
set -g status-right "#[fg=magenta]#{pane_tty} #[fg=blue,bold]#S " # apply custom colors to the right status bar
set -wg window-status-current-format "#[fg=blue,bold] #I:#W "     # format for the currently active window
set -wg window-status-format "#[fg=brightblack] #I:#W "           # format for inactive windows


# pane navigation #
###################

bind -r h select-pane -L # move focus to the left pane
bind -r j select-pane -D # move focus to the bottom pane
bind -r k select-pane -U # move focus to the top pane
bind -r l select-pane -R # move focus to the right pane

bind -r C-h resize-pane -L 5 # resize current pane 5 columns to the left
bind -r C-j resize-pane -D 5 # resize current pane 5 lines down
bind -r C-k resize-pane -U 5 # resize current pane 5 lines up
bind -r C-l resize-pane -R 5 # resize current pane 5 columns to the right


# window navigation #
#####################

bind -r H previous-window # switch to the previous window
bind -r L next-window     # switch to the next window

bind 0 select-window -t 10 # reuse the 0 key for the 10th window

bind -r M-h swap-window -t -1\; select-window -t -1 # move current window one position to the left
bind -r M-l swap-window -t +1\; select-window -t +1 # move current window one position to the right

bind '"' split-window -c "#{pane_current_path}"    # split window horizontally, keeping current directory
bind '%' split-window -h -c "#{pane_current_path}" # split window vertically, keeping current directory


# copy mode & clipboard #
#########################

# use escape to enter copy mode
unbind [               # unbind default copy mode key
bind Escape copy-mode  # use escape to enter copy mode (mimics vim normal mode)

# use v to start highlighting text (vim visual mode)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection # use 'v' to begin visual selection

# use p to paste from Tmux buffer
unbind p             # unbind default paste key
bind p paste-buffer  # use 'p' to paste the copied content

# yank (copy) highlighted text to system clipboard
# bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy' # macos
# bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'wl-copy' # linux

# utility #
###########

# quick reload of the tmux configuration file without restarting the server
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux configuration reloaded!!"
