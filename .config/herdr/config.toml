# general #
###########

onboarding = false


[theme]
name = "catppuccin"


[terminal]
shell_mode = "auto"
new_cwd = "follow"


[keys]
prefix = "ctrl+b"
# previous_tab = ["prefix+p", "prefix+shift+h"] # vim-style previous tab, keeps the prefix+p default
# next_tab = ["prefix+n", "prefix+shift+l"]     # vim-style next tab, keeps the prefix+n default
# swap_pane_left = ""                            # unbind default prefix+shift+h, now used by previous_tab
# swap_pane_right = ""                           # unbind default prefix+shift+l, now used by next_tab


[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
right_click_passthrough_modifier = "alt"
[ui.toast]
delivery = "system"
delay_seconds = 3
[ui.toast.clipboard]
enabled = false
[ui.sound.agents]
claude = "on"


[session]
resume_agents_on_restore = true
